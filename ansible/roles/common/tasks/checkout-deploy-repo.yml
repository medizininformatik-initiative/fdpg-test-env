---

- name: Repo
  tags: common
  block:
  - name: Check if deployment is checked out
    stat:
      path: "{{ deploy_path }}"
    become: true
    become_user: ubuntu
    register: deploy_dir

  - name: Check for updates
    shell:
      chdir: "{{ deploy_path }}"
      cmd: |
        git fetch
        test $(git rev-parse 'origin/{{ dataportal_version }}') = $(git rev-parse HEAD)
    become: true
    become_user: ubuntu
    register: git_status
    failed_when: git_status.rc > 1
    changed_when: git_status.rc == 1
    when: deploy_dir.stat.isdir is defined and deploy_dir.stat.isdir

  - name: Checkout deployment project
    git:
      repo: 'https://github.com/medizininformatik-initiative/feasibility-deploy.git'
      dest: "{{ deploy_path }}"
      version: "{{ dataportal_version }}"
      force: true
    become: true
    become_user: ubuntu
    when: deploy_dir.stat.isdir is not defined or deploy_dir.stat.isdir == false or git_status.changed

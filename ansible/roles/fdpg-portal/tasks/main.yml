---
# tasks file for fdpg-portal
- name: Checkout FDPG Deployment
  include_role:
    name: common
    tasks_from: checkout-deploy-repo
  tags:
  - common

- name: Deploy Proxy
  include_tasks: proxy.yml
  vars:
    project_path: "{{ deploy_path }}/data-portal/proxy"
    project_name: fdpg
  tags: proxy

- name: Deploy DSF
  include_tasks: dsf.yml
  vars:
    project_path: "{{ deploy_path }}/data-portal/dsf"
    project_name: fdpg
  tags: dsf

- name: Deploy backend
  include_tasks: backend.yml
  vars:
    project_path: "{{ deploy_path }}/data-portal/backend"
    project_name: fdpg
  tags: backend

- name: Deploy GUI
  include_tasks: gui.yml
  vars:
    project_path: "{{ deploy_path }}/data-portal/gui"
    project_name: fdpg
  tags: gui

---
- name: Keycloak - Get Keycloak auth token
  uri:
    url: https://{{ fdpg_auth_domain }}/realms/master/protocol/openid-connect/token
    method: POST
    validate_certs: false
    body: "username=admin&password={{ admin_password }}&grant_type=password&client_id=admin-cli"
    status_code: 200
    headers:
      Content-Type: "application/x-www-form-urlencoded"
  register: access_token_result

- name: Keycloak - Extract Keycloak Auth Token
  set_fact:
    access_token_bearer: "{{ access_token_result.json | json_query('access_token') }}"

- name: Keycloak - Check for existing Keycloak user '{{ username }}'
  uri:
    url: https://{{ fdpg_auth_domain }}/admin/realms/dataportal/users?username={{ username }}&exact=true
    method: GET
    validate_certs: false
    status_code: 200
    headers:
      Authorization: "Bearer {{ access_token_bearer }}"
    return_content: true
  register: keycloak_user_info

- name: Keycloak - Create Keycloak user '{{ username }}'
  uri:
    url: https://{{ fdpg_auth_domain }}/admin/realms/dataportal/users
    method: POST
    validate_certs: false
    body: "{{ lookup('template','kc-user.json.j2') }}"
    body_format: json
    status_code: 201
    headers:
      Authorization: "Bearer {{ access_token_bearer }}"
    return_content: true
  when: (keycloak_user_info.json is undefined) or ((keycloak_user_info.json | type_debug == 'list') and (keycloak_user_info.json | length == 0))
  register: keycloak_user

- name: Keycloak - Get role IDs
  uri:
    url: "https://{{ fdpg_auth_domain }}/admin/realms/dataportal/roles?search={{ item.name }}"
    method: GET
    validate_certs: false
    status_code: 200
    headers:
      Authorization: "Bearer {{ access_token_bearer }}"
    return_content: true
  register: keycloak_role_results
  loop: "{{ kc_roles | list | flatten }}"
  when: kc_roles is defined
  failed_when: keycloak_role_results.json is not defined or (keycloak_role_results.json | json_query("[?name == '" + item.name + "']") | length) == 0
  changed_when: false

- name: Keycloak - Attach role IDs to role (Init)
  set_fact:
    kc_roles_with_id: []

- name: Keycloak - Attach role IDs to role
  set_fact:
    kc_roles_with_id: >-
      {{ kc_roles_with_id + [ (item.item | combine({'id': (item.json | json_query("[?name == '" + item.item.name + "'].id") | first) })) ] }}
  loop: "{{ keycloak_role_results.results }}"
  when: keycloak_role_results is defined

- name: Keycloak - Assign roles to Keycloak user '{{ username }}'
  uri:
    url: "{{ keycloak_user.location if keycloak_user.location is defined else 'https://' + fdpg_auth_domain + '/admin/realms/dataportal/users/' + keycloak_user_info.json[0].id }}/role-mappings/realm"
    method: POST
    validate_certs: false
    body: "{{ lookup('template','kc-role-mapping.json.j2') }}"
    body_format: json
    status_code: 204
    headers:
      Authorization: "Bearer {{ access_token_bearer }}"
    return_content: true
  register: keycloak_role_mapping
  when: (keycloak_user.location is defined or (keycloak_user_info.json is defined and (keycloak_user_info.json | length) == 1)) and kc_roles is defined

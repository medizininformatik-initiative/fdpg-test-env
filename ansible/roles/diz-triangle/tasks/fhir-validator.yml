- name: FHIR Validator
  tags: fhir-validator
  block:
  - name: FHIR Validator - Get environment config stats
    stat:
      path: "{{ project_path }}/.env"
    register: fhir_validator_env

  - name: FHIR Validator - Download IGS
    ansible.builtin.shell:
      cmd: bash ./get-igs.sh
      chdir: "{{ project_path }}"
    
  - name: FHIR Validator - Get default environment config stats
    stat:
      path: "{{ project_path }}/.env.default"
    register: fhir_validator_env_default

  - name: FHIR Validator - Copy default environment config
    copy:
      src: "{{ project_path }}/.env.default"
      dest: "{{ project_path }}/.env"
      owner: ubuntu
      group: ubuntu
      mode: u+rw,g-wx,o-rwx
      remote_src: true
    when: fhir_validator_env.stat.exists == false or fhir_validator_env.stat.ctime < fhir_validator_env_default.stat.ctime

  - name: FHIR Validator - Start container
    community.docker.docker_compose_v2:
      project_src: "{{ project_path }}"
      project_name: "{{ project_name }}"
    environment:
      COMPOSE_IGNORE_ORPHANS: "1"

- name: FHIR Flattener
  tags: fhir-flattener
  block:
  - name: FHIR Flattener - Get environment config stats
    stat:
      path: "{{ project_path }}/.env"
    register: fhir_flattener_env

  - name: FHIR Flattener - Get default environment config stats
    stat:
      path: "{{ project_path }}/.env.default"
    register: fhir_flattener_env_default

  - name: FHIR Flattener - Copy default environment config
    copy:
      src: "{{ project_path }}/.env.default"
      dest: "{{ project_path }}/.env"
      owner: ubuntu
      group: ubuntu
      mode: u+rw,g-wx,o-rwx
      remote_src: true
    when: fhir_flattener_env.stat.exists == false or fhir_flattener_env.stat.ctime < fhir_flattener_env_default.stat.ctime

  - name: FHIR Flattener - Start container
    community.docker.docker_compose_v2:
      project_src: "{{ project_path }}"
      project_name: "{{ project_name }}"
    environment:
      COMPOSE_IGNORE_ORPHANS: "1"
